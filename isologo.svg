<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A37"/>
      <stop offset="1" stop-color="#16232E"/>
    </linearGradient>
    <pattern id="grid" width="42.6" height="42.6" patternUnits="userSpaceOnUse">
      <path d="M 42.6 0 L 0 0 0 42.6" fill="none" stroke="#2C5AA0" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="clip">
      <rect x="0" y="0" width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#bg)" opacity="0.25"/>
  </g>

  <!-- Letra E en Fraunces -->
  <text x="197" y="335" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="272" fill="#F6F4EE" text-anchor="middle">E</text>

  <!-- punto acento -->
  <circle cx="352" cy="164" r="26" fill="#E8A33D"/>
</svg>
